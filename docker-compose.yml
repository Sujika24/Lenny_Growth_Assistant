version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lenny_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lenny_growth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenny_growth"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lenny_backend
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@postgres:5432/lenny_growth
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2:3b
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - TRANSCRIPTS_DATA_DIR=/app/data/lenny_repo/episodes
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/data/chroma_db
      - ./data/lenny_repo:/app/data/lenny_repo
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lenny_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
